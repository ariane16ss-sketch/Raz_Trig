<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memoria Trigonométrica - Notables y Cuadrantales</title>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #1e293b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --correct: #22c55e;
            --back-card: #3b82f6;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .game-container {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            padding: 25px;
            max-width: 650px;
            width: 100%;
            text-align: center;
        }

        h1 { margin-top: 0; color: var(--secondary); font-size: 1.6rem; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .stat-box {
            background: #e0e7ff;
            color: var(--primary);
            padding: 8px 16px;
            border-radius: 20px;
        }

        .memory-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
            perspective: 1000px;
        }

        .card {
            height: 90px;
            cursor: pointer;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.3s ease;
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            box-sizing: border-box;
            padding: 5px;
        }

        .card-front {
            background-color: var(--back-card);
            color: white;
            font-size: 2rem;
        }

        .card-back {
            background-color: #ffffff;
            color: var(--text);
            border: 3px solid var(--primary);
            transform: rotateY(180deg);
        }

        .card.matched .card-back {
            background-color: var(--correct) !important;
            color: white !important;
            border-color: var(--correct) !important;
        }

        .btn-action {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-action:hover { background-color: #4f46e5; }
        .hidden { display: none; }

        #final-time { color: var(--primary); font-size: 3rem; margin: 15px 0; }
    </style>
</head>
<body>

<div class="game-container">
    <div id="start-screen">
        <h1>🧠 Memoria Trigonométrica Avanzada</h1>
        <p>Ángulos Notables (30°, 45°, 60°) y Cuadrantales (0°, 90°, 180°, 270°, 360°).</p>
        <p style="font-size: 0.85rem; color: #666;">Nota: Las funciones no definidas se muestran como "N.D."</p>
        <button class="btn-action" onclick="startGame()">Comenzar Jugada</button>
    </div>

    <div id="game-screen" class="hidden">
        <div class="header">
            <div class="stat-box">⏱️ Tiempo: <span id="timer">0.0</span>s</div>
            <div class="stat-box">🎯 Parejas: <span id="matches">0</span> / 8</div>
        </div>

        <div class="memory-grid" id="grid"></div>
    </div>

    <div id="end-screen" class="hidden">
        <h2>🎉 ¡Jugada Completada!</h2>
        <p>Tu tiempo final fue:</p>
        <h1 id="final-time">0.00s</h1>
        <button class="btn-action" onclick="startGame()">Siguiente Alumno</button>
    </div>
</div>

<script>
    // --- MAZO EXTENDIDO DE 48 PAREJAS ---
    const FULL_DECK = [
        // NOTABLES (30°, 45°, 60°)
        { id: 1, name: "sen(30°)" }, { id: 1, val: "1/2" },
        { id: 2, name: "sen(45°)" }, { id: 2, val: "√2/2" },
        { id: 3, name: "sen(60°)" }, { id: 3, val: "√3/2" },
        { id: 4, name: "cos(30°)" }, { id: 4, val: "√3/2" },
        { id: 5, name: "cos(45°)" }, { id: 5, val: "√2/2" },
        { id: 6, name: "cos(60°)" }, { id: 6, val: "1/2" },
        { id: 7, name: "tan(30°)" }, { id: 7, val: "√3/3" },
        { id: 8, name: "tan(45°)" }, { id: 8, val: "1" },
        { id: 9, name: "tan(60°)" }, { id: 9, val: "√3" },
        { id: 10, name: "csc(30°)" }, { id: 10, val: "2" },
        { id: 11, name: "csc(45°)" }, { id: 11, val: "√2" },
        { id: 12, name: "csc(60°)" }, { id: 12, val: "2√3/3" },
        { id: 13, name: "sec(30°)" }, { id: 13, val: "2√3/3" },
        { id: 14, name: "sec(45°)" }, { id: 14, val: "√2" },
        { id: 15, name: "sec(60°)" }, { id: 15, val: "2" },
        { id: 16, name: "cot(30°)" }, { id: 16, val: "√3" },
        { id: 17, name: "cot(45°)" }, { id: 17, val: "1" },
        { id: 18, name: "cot(60°)" }, { id: 18, val: "√3/3" },

        // CUADRANTALES (0°, 90°, 180°, 270°, 360°)
        // Seno
        { id: 19, name: "sen(0°)" }, { id: 19, val: "0" },
        { id: 20, name: "sen(90°)" }, { id: 20, val: "1" },
        { id: 21, name: "sen(180°)" }, { id: 21, val: "0" },
        { id: 22, name: "sen(270°)" }, { id: 22, val: "-1" },
        { id: 23, name: "sen(360°)" }, { id: 23, val: "0" },
        // Coseno
        { id: 24, name: "cos(0°)" }, { id: 24, val: "1" },
        { id: 25, name: "cos(90°)" }, { id: 25, val: "0" },
        { id: 26, name: "cos(180°)" }, { id: 26, val: "-1" },
        { id: 27, name: "cos(270°)" }, { id: 27, val: "0" },
        { id: 28, name: "cos(360°)" }, { id: 28, val: "1" },
        // Tangente
        { id: 29, name: "tan(0°)" }, { id: 29, val: "0" },
        { id: 30, name: "tan(90°)" }, { id: 30, val: "N.D." },
        { id: 31, name: "tan(180°)" }, { id: 31, val: "0" },
        { id: 32, name: "tan(270°)" }, { id: 32, val: "N.D." },
        { id: 33, name: "tan(360°)" }, { id: 33, val: "0" },
        // Cosecante
        { id: 34, name: "csc(0°)" }, { id: 34, val: "N.D." },
        { id: 35, name: "csc(90°)" }, { id: 35, val: "1" },
        { id: 36, name: "csc(180°)" }, { id: 36, val: "N.D." },
        { id: 37, name: "csc(270°)" }, { id: 37, val: "-1" },
        { id: 38, name: "csc(360°)" }, { id: 38, val: "N.D." },
        // Secante
        { id: 39, name: "sec(0°)" }, { id: 39, val: "1" },
        { id: 40, name: "sec(90°)" }, { id: 40, val: "N.D." },
        { id: 41, name: "sec(180°)" }, { id: 41, val: "-1" },
        { id: 42, name: "sec(270°)" }, { id: 42, val: "N.D." },
        { id: 43, name: "sec(360°)" }, { id: 43, val: "1" },
        // Cotangente
        { id: 44, name: "cot(0°)" }, { id: 44, val: "N.D." },
        { id: 45, name: "cot(90°)" }, { id: 45, val: "0" },
        { id: 46, name: "cot(180°)" }, { id: 46, val: "N.D." },
        { id: 47, name: "cot(270°)" }, { id: 47, val: "0" },
        { id: 48, name: "cot(360°)" }, { id: 48, val: "N.D." }
    ];

    const PAIRS_PER_GAME = 8;
    let activeCards = [];
    let flippedCards = [];
    let matchedCount = 0;
    let timerInterval = null;
    let startTime = 0;
    let elapsedTime = 0;

    function shuffle(array) {
        return array.sort(() => Math.random() - 0.5);
    }

    function selectRandomPairs() {
        // Seleccionar 8 IDs únicos de entre los 48 disponibles
        const totalPairs = FULL_DECK.length / 2;
        const uniqueIds = Array.from({ length: totalPairs }, (_, i) => i + 1);
        const shuffledIds = shuffle(uniqueIds);
        const selectedIds = shuffledIds.slice(0, PAIRS_PER_GAME);

        let gameDeck = [];
        selectedIds.forEach(id => {
            const pair = FULL_DECK.filter(card => card.id === id);
            gameDeck.push(...pair);
        });

        return shuffle(gameDeck);
    }

    function startGame() {
        matchedCount = 0;
        flippedCards = [];
        activeCards = selectRandomPairs();
        
        document.getElementById('start-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');
        
        document.getElementById('matches').innerText = '0';
        document.getElementById('timer').innerText = '0.0';

        renderGrid();
        startTimer();
    }

    function startTimer() {
        clearInterval(timerInterval);
        startTime = Date.now();
        timerInterval = setInterval(() => {
            elapsedTime = (Date.now() - startTime) / 1000;
            document.getElementById('timer').innerText = elapsedTime.toFixed(1);
        }, 100);
    }

    function stopTimer() {
        clearInterval(timerInterval);
    }

    function renderGrid() {
        const grid = document.getElementById('grid');
        grid.innerHTML = '';

        activeCards.forEach((cardData, index) => {
            const cardEl = document.createElement('div');
            cardEl.classList.add('card');
            cardEl.dataset.index = index;
            cardEl.dataset.id = cardData.id;

            const faceFront = document.createElement('div');
            faceFront.classList.add('card-face', 'card-front');
            faceFront.innerText = '?';

            const faceBack = document.createElement('div');
            faceBack.classList.add('card-face', 'card-back');
            faceBack.innerText = cardData.name || cardData.val; 

            cardEl.appendChild(faceFront);
            cardEl.appendChild(faceBack);

            cardEl.onclick = () => flipCard(cardEl, cardData);
            grid.appendChild(cardEl);
        });
    }

    function flipCard(cardEl, cardData) {
        if (flippedCards.length === 2 || cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) {
            return;
        }

        cardEl.classList.add('flipped');
        flippedCards.push({ element: cardEl, data: cardData });

        if (flippedCards.length === 2) {
            checkMatch();
        }
    }

    function checkMatch() {
        const [card1, card2] = flippedCards;

        if (card1.data.id === card2.data.id) {
            card1.element.classList.add('matched');
            card2.element.classList.add('matched');
            matchedCount++;
            document.getElementById('matches').innerText = matchedCount;
            flippedCards = [];

            if (matchedCount === PAIRS_PER_GAME) {
                stopTimer();
                setTimeout(showEndScreen, 800);
            }
        } else {
            setTimeout(() => {
                card1.element.classList.remove('flipped');
                card2.element.classList.remove('flipped');
                flippedCards = [];
            }, 1000);
        }
    }

    function showEndScreen() {
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('end-screen').classList.remove('hidden');
        document.getElementById('final-time').innerText = `${elapsedTime.toFixed(2)}s`;
    }
</script>
</body>
</html>
